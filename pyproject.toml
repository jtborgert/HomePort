[project]
name = "homeport"
version = "0.3.0"
description = "HomePort is a client for controlling Homey Pro smart home hubs."
readme = "README.md"
authors = [
    { name = "Tobias Borgert", email = "tobias.borgert@posteo.de" }
]
requires-python = ">=3.14"
